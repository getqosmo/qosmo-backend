[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mybot"
version = "0.1.0"
description = "MyBot - a local-first personal life operating system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "SQLAlchemy>=2.0.30",
    "alembic>=1.13",
    "PyJWT>=2.9",
    "argon2-cffi>=23.1",
    "cryptography>=43.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "email-validator>=2.2",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
documents = ["pypdf>=4.3"]
keyring = ["keyring>=25.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
mybot = "mybot_core.cli:main"

[tool.setuptools.packages.find]
where = [
    "apps/api",
    "apps/core",
    "packages/schemas",
    "packages/security",
    "packages/llm",
    "packages/integrations",
    "services",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
